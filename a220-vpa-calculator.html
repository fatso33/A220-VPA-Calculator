    background: radial-gradient(ellipse at 50% -10%, #f2f4f3 0%, #d5d9d8 60%);
  }

  .unit{
    width:100%;
    max-width: 460px;
    background: var(--bezel);
    border: 1px solid var(--bezel-edge);
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .bezel-label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding: 2px 8px 8px;
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 2px;
  }

  .theme-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    background: transparent;
    border: 1px solid var(--bezel-edge);
    border-radius: 20px;
    padding: 3px 4px;
    cursor: pointer;
    font-family: var(--mono);
  }
  .theme-toggle .track{
    position: relative;
    width: 30px;
    height: 15px;
    background: var(--select-bg);
    border: 1px solid var(--line);
    border-radius: 20px;
  }
  body.theme-light .theme-toggle .track{ background: #c9cecd; }
  .theme-toggle .knob{
    position: absolute;
    top: 1px;
    left: 1px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--cyan);
    transition: left 0.15s ease, background 0.15s ease;
  }
  body.theme-light .theme-toggle .knob{ left: 16px; background: var(--amber); }
  .theme-toggle .tlabel{
    color: var(--dim);
    font-size: 9px;
    letter-spacing: 1.5px;
  }

  .screen{
    background: linear-gradient(180deg, var(--screen-top) 0%, var(--screen) 100%);
    border: 1px solid var(--screen-border);
    border-radius: 6px;
    padding: 14px 14px 10px;
    box-shadow: inset 0 0 30px var(--screen-shadow), inset 0 0 2px rgba(79,224,255,0.15);
  }

  .titlebar{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
    margin-bottom: 12px;
  }
  .titlebar .l{ color: var(--white); font-size: 13px; letter-spacing: 3px; font-weight:600;}
  .titlebar .r{ color: var(--cyan); font-size: 11px; letter-spacing: 2px;}

  .input-group{
    background: rgba(79,224,255,0.035);
    border: 1px solid var(--line);
    border-left: 2px solid var(--cyan-dim);
    border-radius: 6px;
    padding: 10px 12px 12px;
    margin-top: 10px;
  }
  .input-group:first-of-type{ margin-top: 0; }

  .field-label{
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 1.5px;
    margin: 0 0 6px;
    display:flex;
    justify-content:space-between;
  }
  .field-label .hint{ color: var(--cyan-dim); }

  .row{ display:flex; gap:8px; }
  .row > *{ flex:1; }

  input[type="number"]{
    width:100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line);
    color: var(--cyan);
    font-family: var(--mono);
    font-size: 22px;
    letter-spacing: 1px;
    padding: 6px 2px 8px;
    outline: none;
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance: none; margin:0; }
  input[type="number"]:focus{ border-bottom-color: var(--cyan); }
  input[type="number"]::placeholder{ color: var(--dim); opacity: 0.6; }

  select{
    width:100%;
    background: var(--select-bg);
    border: 1px solid var(--line);
    color: var(--cyan);
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 1px;
    padding: 10px 8px;
    border-radius: 4px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--cyan) 50%), linear-gradient(135deg, var(--cyan) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 12px) center;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
  }

  .toggle-row{
    display:flex;
    gap:8px;
    margin-top: 2px;
  }
  .toggle-btn{
    flex:1;
    text-align:center;
    padding: 10px 6px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 2px;
    cursor: pointer;
  }
  .toggle-btn.active-off{
    color: var(--green);
    border-color: var(--green-dim);
    background: rgba(53,255,107,0.06);
  }
  .toggle-btn.active-on{
    color: var(--amber);
    border-color: var(--amber-dim);
    background: rgba(255,176,32,0.08);
  }

  .divider{
    border: none;
    border-top: 1px dashed var(--line);
    margin: 16px 0 12px;
  }

  .output-block{
    text-align:center;
    padding: 6px 0 14px;
  }
  .output-label{
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 3px;
  }
  .output-value{
    color: var(--green);
    font-size: 56px;
    font-weight: 600;
    letter-spacing: 1px;
    text-shadow: 0 0 18px rgba(53,255,107,0.35);
    line-height: 1.1;
    margin-top: 2px;
  }
  .output-sub{
    color: var(--cyan-dim);
    font-size: 10px;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .glide-visual{
    display:block;
    margin: 6px auto 2px;
  }

  .steps{
    margin-top: 4px;
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }
  .steps-title{
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    display:flex;
    justify-content:space-between;
  }
  .step-line{
    display:flex;
    justify-content:space-between;
    padding: 4px 0;
    font-size: 12.5px;
    color: var(--white);
    border-bottom: 1px dotted rgba(255,255,255,0.06);
  }
  .step-line .desc{ color: var(--dim); flex:1; }
  .step-line .delta{ color: var(--cyan); min-width: 62px; text-align:right; }
  .step-line.total{
    border-bottom: none;
    border-top: 1px solid var(--line);
    margin-top: 6px;
    padding-top: 8px;
    font-size: 13px;
  }
  .step-line.total .desc{ color: var(--white); letter-spacing: 1px; }
  .step-line.total .delta{ color: var(--green); font-weight: 600; }

  .footnote{
    text-align:center;
    color: #4a5658;
    font-size: 9.5px;
    letter-spacing: 0.5px;
    margin-top: 16px;
    padding: 0 6px;
    line-height: 1.5;
  }

  .install-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    background: rgba(53,255,107,0.06);
    border: 1px solid var(--green-dim);
    border-radius: 6px;
    color: var(--green);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
  }
  .install-btn:active{ background: rgba(53,255,107,0.14); }
  .install-icon{ font-size: 14px; }
</style>
</head>
<body>

<div class="unit">
  <div class="bezel-label">
    <span>MCDU</span>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme">
      <span class="tlabel" id="themeLabel">DARK</span>
      <span class="track"><span class="knob"></span></span>
    </button>
    <span>DES • PERF</span>
  </div>

  <div class="screen">
    <div class="titlebar">
      <span class="l">DES VPA</span>
      <span class="r">A220</span>
    </div>

    <div class="input-group">
      <div class="field-label"><span>LDG WEIGHT</span><span class="hint">EST</span></div>
      <div class="row">
        <input type="number" id="ldgWeight" placeholder="0.0" step="0.1" inputmode="decimal">
        <select id="wtUnit" style="max-width:110px; flex:none;">
          <option value="t">T (metric)</option>
          <option value="kg">KG</option>
          <option value="lb" selected>LB</option>
        </select>
      </div>
    </div>

    <div class="input-group">
      <div class="field-label"><span>WIND COMPONENT</span><span class="hint">HEAD(−) / TAIL(+) KT</span></div>
      <input type="number" id="wind" placeholder="0" step="1" inputmode="decimal">
    </div>

    <div class="input-group">
      <div class="field-label"><span>ISA DEVIATION</span><span class="hint">°C</span></div>
      <input type="number" id="isa" placeholder="0" step="1" inputmode="decimal">
    </div>

    <div class="input-group">
      <div class="field-label"><span>ANTI-ICE</span><span class="hint">ANTICIPATED</span></div>
      <div class="toggle-row">
        <button type="button" class="toggle-btn active-off" id="btnOff">OFF</button>
        <button type="button" class="toggle-btn" id="btnOn">ON</button>
      </div>
    </div>

    <hr class="divider">

    <div class="output-block">
      <div class="output-label">TARGET VPA</div>
      <div class="output-value" id="vpaOut">3.0°</div>
      <svg class="glide-visual" id="glideSvg" width="180" height="70" viewBox="0 0 180 70"></svg>
      <div class="output-sub" id="wtTonsOut">LDG WT 24.9 T</div>
    </div>

    <div class="steps">
      <div class="steps-title"><span>CALC</span><span>DELTA</span></div>
      <div id="stepsList"></div>
    </div>
  </div>

  <div class="footnote">
    REFERENCE / TRAINING TOOL ONLY — NOT FOR OPERATIONAL USE.<br>
    VERIFY ALL DESCENT PLANNING AGAINST CURRENT OPS DATA / FCOM.
  </div>

  <button type="button" class="install-btn" id="installBtn" style="display:none;">
    <span class="install-icon">⇩</span> INSTALL APP
  </button>
</div>

<script>
  const ldgWeightEl = document.getElementById('ldgWeight');
  const wtUnitEl = document.getElementById('wtUnit');
  const windEl = document.getElementById('wind');
  const isaEl = document.getElementById('isa');
  const btnOff = document.getElementById('btnOff');
  const btnOn = document.getElementById('btnOn');
  const vpaOut = document.getElementById('vpaOut');
  const wtTonsOut = document.getElementById('wtTonsOut');
  const stepsList = document.getElementById('stepsList');
  const glideSvg = document.getElementById('glideSvg');

  const themeToggle = document.getElementById('themeToggle');
  const themeLabel = document.getElementById('themeLabel');
  themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('theme-light');
    const isLight = document.body.classList.contains('theme-light');
    themeLabel.textContent = isLight ? 'LIGHT' : 'DARK';
    calculate();
  });

  let antiIce = false;

  btnOff.addEventListener('click', () => { antiIce = false; updateToggle(); calculate(); });
  btnOn.addEventListener('click', () => { antiIce = true; updateToggle(); calculate(); });

  function updateToggle(){
    btnOff.className = 'toggle-btn' + (!antiIce ? ' active-off' : '');
    btnOn.className = 'toggle-btn' + (antiIce ? ' active-on' : '');
  }

  function toMetricTons(value, unit){
    if (unit === 't') return value;
    if (unit === 'kg') return value / 1000;
    if (unit === 'lb') return (value * 0.45359237) / 1000;
    return value;
  }

  function fmt(n, d=2){
    const v = Number(n.toFixed(d));
    return (v > 0 ? '+' : '') + (v === 0 ? (0).toFixed(d) : v.toFixed(d));
  }

  function drawGlide(angleDeg){
    const runwayY = 58;
    const startX = 14, startY = 12;
    const touchdownX = 168;
    const runLen = touchdownX - startX;

    const isLight = document.body.classList.contains('theme-light');
    const runwayColor = isLight ? '#c5cbca' : '#1c2a2e';
    const rwyTextColor = isLight ? '#5c6a67' : '#4a5658';
    const pathColor = isLight ? '#157a34' : '#35ff6b';
    const startColor = isLight ? '#007391' : '#4fe0ff';
    const dimColor = isLight ? '#b6bcbb' : '#2a3336';

    if (angleDeg === null || isNaN(angleDeg)){
      glideSvg.innerHTML = `
        <line x1="0" y1="${runwayY}" x2="180" y2="${runwayY}" stroke="${runwayColor}" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="152" y="${runwayY+11}" fill="${rwyTextColor}" font-size="8" font-family="ui-monospace, monospace">RWY</text>
        <line x1="${startX}" y1="${startY}" x2="${touchdownX}" y2="${runwayY}" stroke="${dimColor}" stroke-width="2" stroke-dasharray="4,4"/>
        <circle cx="${startX}" cy="${startY}" r="2.5" fill="${dimColor}"/>
      `;
      return;
    }

    const angleRad = angleDeg * Math.PI / 180;

    // descend from startY down toward the runway at the computed angle
    let endX = startX + runLen;
    let endY = startY + runLen * Math.tan(angleRad);
    if (endY > runwayY){
      // path would go below the runway before reaching touchdownX - clip to runway
      const clippedLen = (runwayY - startY) / Math.tan(angleRad);
      endX = startX + clippedLen;
      endY = runwayY;
    }

    // arrow direction along the descent path
    const dx = endX - startX, dy = endY - startY;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const ux = dx/len, uy = dy/len;
    const ah = 7;
    const perpX = -uy, perpY = ux;

    glideSvg.innerHTML = `
      <line x1="0" y1="${runwayY}" x2="180" y2="${runwayY}" stroke="${runwayColor}" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="152" y="${runwayY+11}" fill="${rwyTextColor}" font-size="8" font-family="ui-monospace, monospace">RWY</text>
      <line x1="${startX}" y1="${startY}" x2="${endX}" y2="${endY}" stroke="${pathColor}" stroke-width="2"/>
      <circle cx="${startX}" cy="${startY}" r="2.5" fill="${startColor}"/>
      <path d="M ${endX - ux*ah - perpX*4} ${endY - uy*ah - perpY*4} L ${endX} ${endY} L ${endX - ux*ah + perpX*4} ${endY - uy*ah + perpY*4}" fill="none" stroke="${pathColor}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    `;
  }

  function calculate(){
    if (ldgWeightEl.value === ''){
      vpaOut.textContent = '--.--°';
      wtTonsOut.textContent = 'LDG WT -- T';
      stepsList.innerHTML = `<div class="step-line"><span class="desc">AWAITING LDG WEIGHT ENTRY</span><span class="delta">--</span></div>`;
      drawGlide(null);
      return;
    }

    const rawWeight = parseFloat(ldgWeightEl.value) || 0;
    const unit = wtUnitEl.value;
    const wind = parseFloat(windEl.value) || 0;
    const isa = parseFloat(isaEl.value) || 0;

    const weightTons = toMetricTons(rawWeight, unit);

    const base = 3.0;

    let weightDelta;
    if (weightTons < 55){
      weightDelta = ((55 - weightTons) / 5) * 0.2;
    } else {
      weightDelta = -((weightTons - 55) / 5) * 0.1;
    }

    const isaDelta = -(isa / 10) * 0.1;
    const windDelta = -(wind / 10) * 0.1;
    const antiIceDelta = antiIce ? -0.2 : 0;

    const total = base + weightDelta + isaDelta + windDelta + antiIceDelta;

    vpaOut.textContent = total.toFixed(2) + '°';
    wtTonsOut.textContent = 'LDG WT ' + weightTons.toFixed(2) + ' T';

    const windLabel = wind === 0 ? 'CALM' : (wind < 0 ? Math.abs(wind) + 'KT HEAD' : wind + 'KT TAIL');
    const weightLabel = (weightTons < 55 ? (55-weightTons).toFixed(2) + 'T UNDER' : weightTons > 55 ? (weightTons-55).toFixed(2) + 'T OVER' : 'AT 55T');

    stepsList.innerHTML = `
      <div class="step-line"><span class="desc">BASE VPA (55T REF)</span><span class="delta">${base.toFixed(2)}°</span></div>
      <div class="step-line"><span class="desc">WEIGHT ${weightTons.toFixed(2)}T (${weightLabel})</span><span class="delta">${fmt(weightDelta)}°</span></div>
      <div class="step-line"><span class="desc">ISA DEV ${isa >= 0 ? '+' : ''}${isa}°C</span><span class="delta">${fmt(isaDelta)}°</span></div>
      <div class="step-line"><span class="desc">WIND ${windLabel}</span><span class="delta">${fmt(windDelta)}°</span></div>
      <div class="step-line"><span class="desc">ANTI-ICE ${antiIce ? 'ON' : 'OFF'}</span><span class="delta">${fmt(antiIceDelta)}°</span></div>
      <div class="step-line total"><span class="desc">TARGET VPA</span><span class="delta">${total.toFixed(2)}°</span></div>
    `;

    drawGlide(total);
  }

  [ldgWeightEl, wtUnitEl, windEl, isaEl].forEach(el => {
    el.addEventListener('input', calculate);
    el.addEventListener('change', calculate);
  });

  updateToggle();
  calculate();

  // Register service worker (enables PWA installability when hosted over HTTPS)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  // Native "Install App" prompt handling
  const installBtn = document.getElementById('installBtn');
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'flex';
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    installBtn.disabled = true;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
    installBtn.disabled = false;
  });

  window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
    deferredPrompt = null;
  });
</script>

</body>
</html>
